<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wholesale Catalogue</title>
<style>
  :root {
    --bg: #f7f7f5;
    --card-bg: #ffffff;
    --text: #1a1a1a;
    --muted: #6b6b6b;
    --border: #e5e5e3;
    --accent: #2d6a4f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 24px 32px;
    border-bottom: 1px solid var(--border);
    background: var(--card-bg);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }
  header h1 { margin: 0; font-size: 1.4rem; }
  #meta { color: var(--muted); font-size: 0.9rem; }
  #search {
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 0.95rem;
    width: 240px;
  }
  main { padding: 24px 32px; }
  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    transition: box-shadow 0.15s ease;
  }
  .card:hover { box-shadow: 0 4px 14px rgba(0,0,0,0.08); }
  .card img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    display: block;
    background: #eee;
  }
  .card .info { padding: 10px 12px; }
  .card .item-number { font-weight: 600; font-size: 0.95rem; }
  #empty {
    text-align: center;
    color: var(--muted);
    padding: 60px 20px;
    display: none;
  }
  #gate {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 14px;
    padding: 20px;
  }
  #gate h2 { margin: 0 0 4px; font-size: 1.2rem; }
  #gate input {
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 1rem;
    width: 220px;
    text-align: center;
  }
  #gate button {
    padding: 10px 20px;
    border: none;
    border-radius: 6px;
    background: var(--accent);
    color: white;
    font-size: 0.95rem;
    cursor: pointer;
  }
  #gate-error { color: #b3261e; font-size: 0.85rem; min-height: 1.2em; }
  #catalogue-content { display: none; }
</style>
</head>
<body>

<div id="gate">
  <h2>Enter password to view catalogue</h2>
  <input id="gate-password" type="password" placeholder="Password" autocomplete="off">
  <button onclick="checkPassword()">View catalogue</button>
  <div id="gate-error"></div>
</div>

<div id="catalogue-content">
  <header>
    <div>
      <h1>Catalogue</h1>
      <div id="meta">Loading...</div>
    </div>
    <input id="search" type="text" placeholder="Search item number...">
  </header>

  <main>
    <div id="grid"></div>
    <div id="empty">No matching items.</div>
  </main>
</div>

<script>
  // Simple deterrent, not real security — anyone who views this page's
  // source, or fetches catalogue.json directly, can bypass this.
  // Good enough to stop randoms who stumble on the link; not a login system.
  const CATALOGUE_PASSWORD = "12345678";

  function checkPassword() {
    const input = document.getElementById('gate-password').value;
    if (input === CATALOGUE_PASSWORD) {
      sessionStorage.setItem('catalogue_unlocked', 'yes');
      showCatalogue();
    } else {
      document.getElementById('gate-error').textContent = 'Incorrect password.';
    }
  }

  document.getElementById('gate-password').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') checkPassword();
  });

  function showCatalogue() {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('catalogue-content').style.display = 'block';
    loadCatalogue();
  }

  if (sessionStorage.getItem('catalogue_unlocked') === 'yes') {
    showCatalogue();
  }

  let allItems = [];

  async function loadCatalogue() {
    try {
      const res = await fetch('catalogue.json');
      allItems = await res.json();
      document.getElementById('meta').textContent =
        `${allItems.length} items`;
      render(allItems);
    } catch (err) {
      document.getElementById('meta').textContent =
        'Could not load catalogue.json — run scrape.py first.';
      console.error(err);
    }
  }

  function render(items) {
    const grid = document.getElementById('grid');
    const empty = document.getElementById('empty');
    grid.innerHTML = '';

    if (items.length === 0) {
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';

    for (const item of items) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <img src="${item.local_image || item.image_url}" alt="${item.item_number}" loading="lazy">
        <div class="info">
          <div class="item-number">${item.item_number}</div>
        </div>
      `;
      grid.appendChild(card);
    }
  }

  document.getElementById('search').addEventListener('input', (e) => {
    const q = e.target.value.trim().toLowerCase();
    const filtered = allItems.filter(i => i.item_number.toLowerCase().includes(q));
    render(filtered);
  });

  loadCatalogue();
</script>

</body>
</html>
