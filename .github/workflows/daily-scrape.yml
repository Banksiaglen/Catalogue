name: Daily catalogue update

on:
  schedule:
    - cron: '0 20 * * *'   # 20:00 UTC daily — adjust for your timezone
  workflow_dispatch:        # lets you trigger it manually from the Actions tab too

permissions:
  contents: write

jobs:
  update-catalogue:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        env:
          BANKSIA_USERNAME: ${{ secrets.BANKSIA_USERNAME }}
          BANKSIA_PASSWORD: ${{ secrets.BANKSIA_PASSWORD }}
        run: python3 scrape.py

      - name: Commit updated catalogue
        run: |
          git config user.name "catalogue-bot"
          git config user.email "actions@github.com"
          git add catalogue.json images/
          git diff --quiet --cached || git commit -m "Daily catalogue update"
          git push
